image:
  repository: ghcr.io/mediactl/cluster-plex
  tag: dev
  pullPolicy: IfNotPresent

plex:
  # Every pod runs Plex against the shared library and serves clients; the
  # Lease decides only which one talks to plex.tv. See ADR-0004.
  replicas: 3
  # Pin the server identity so a rebuilt cluster keeps the identity clients
  # already know. Setting this on a server that already has one CHANGES it.
  machineIdentifier: ""
  # Settings an operator chooses, applied on every start. A list, not a map:
  # the config loader lowercases nested map keys and Plex names are case
  # sensitive.
  #
  # The settings this architecture depends on are NOT configurable here and the
  # manager will refuse to start if one is declared: the Butler schedulers (off,
  # replaced by the CronJobs below), remote-access publishing and automatic port
  # mapping (off, so no pod publishes itself to plex.tv or punches a hole to a
  # pod address), and customConnections (set from proxy.externalURL).
  preferences:
    - name: FriendlyName
      value: Cluster Plex
  # Metadata providers to register, by their root. PMS fetches each root;
  # it must answer before anything using it is provisioned.
  metadataProviders: []
  #  - uri: http://clustarr-ui.clustarr-system.svc:8080/plex/movies
  #  - uri: http://clustarr-ui.clustarr-system.svc:8080/plex/tv
  # Libraries to create on those providers' agents. switchAgent: true lets
  # the lease holder move an existing library of the same name onto the
  # agent (and force a refresh); off, it is only reported as drifted.
  libraries: []
  #  - name: Movies
  #    type: movie
  #    provider: tv.plex.agents.custom.clustarr.movies
  #    language: en-US
  #    locations: [/media/movies]
  #    switchAgent: false
  # Follow a clustarr install: rescan what its files change and refresh
  # what its metadata changes. Grants get/list/watch on its catalog in
  # that namespace, and the token Secret below when one is named.
  clustarr:
    enabled: false
    namespace: clustarr-system
    pathMappings: []
    #  - {clustarr: /data/media, plex: /media}
    # A Secret in that namespace holding the server's plex.tv account --
    # "token" (for clustarr's Plex watchlist ImportList), "username",
    # "email" -- and the claim code last spent. The first lease holder
    # writes it from Preferences.xml; from then on every replica is held to
    # it (docs/configuration.md). Grants get and update on that one Secret,
    # and create on Secrets there.
    tokenSecret: ""
  # A Secret holding a plex.tv claim code (https://plex.tv/claim) under
  # claimSecret.key, exchanged for the server's token at the next start when
  # the server has none or, with plex.clustarr.tokenSecret, when the code is
  # new. Optional: an absent Secret starts Plex as it is.
  claimSecret:
    name: ""  # default <release>-plex-claim
    key: claim
  # Plex wants little at rest and several cores for a transcode. The request
  # is what the scheduler places by; the memory limit keeps a runaway
  # transcode from taking the node with it. No CPU limit on purpose: a
  # throttled transcoder stutters.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  # One pod per node where the cluster has the nodes (ScheduleAnyway, so a
  # smaller cluster still schedules). Every pod serves, so this is what makes
  # a node going away cost one third rather than everything.
  spreadAcrossNodes: true
  # Plex's network namespace needs CAP_SYS_ADMIN to create and CAP_NET_ADMIN
  # to wire up, and IPv4 forwarding on in the pod namespace. Privileged gives
  # all three and is the default.
  securityContext:
    privileged: true
  # The form without privilege: the two capabilities, and the forwarding set
  # by Kubernetes through the pod's securityContext.sysctls before any
  # container starts, which the manager then finds already on. The cluster
  # has to provide two things first. net.ipv4.ip_forward is an "unsafe"
  # sysctl to Kubernetes, so every kubelet must allow-list it
  # (KubeletConfiguration allowedUnsafeSysctls) or the pod is rejected with
  # SysctlForbidden. And the render device for hardware transcoding no longer
  # comes with privilege: it has to come from a device plugin, for example
  # gpu.intel.com/i915 in resources; without one Plex transcodes in software.
  unprivileged: false
  # How long a stopping pod lets the client connections it holds finish
  # before Plex is stopped. A terminating pod has already left the Service,
  # so new clients go elsewhere; this is for the streams in flight, whose
  # transcode chunks live only on that pod.
  drainTimeout: 2m
  # Must cover drainTimeout plus the 30s Plex gets to flush on SIGTERM.
  terminationGracePeriodSeconds: 180
  # One pod at a time under eviction: every pod serves, and each one that
  # goes takes the sessions pinned to it.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

proxy:
  # The only thing clients connect to. Media bytes are served from here, so
  # THROUGHPUT SCALES WITH NODES, NOT REPLICAS: spreading these across nodes is
  # what raises the ceiling. See docs/media-proxy-pattern.md.
  replicas: 3
  # The address clients actually reach, for example
  # https://plex.example.com:32400. The manager forces this into Plex's
  # Preferences.xml as customConnections on every start. Without it Plex
  # advertises only the link-local address inside its own network namespace,
  # which no client can reach.
  externalURL: ""
  tls:
    # A Secret holding tls.crt and tls.key, served by the proxy. Plex clients
    # prefer a secure connection, and intercepting Plex's own plex.direct name
    # with a different certificate breaks native clients, so serve your own
    # hostname instead and name it in externalURL above.
    secretName: ""
  # How long a request waits for Plex during a failover before giving up.
  failoverGrace: 30s
  resources: {}
  service:
    # Empty asks for whatever the load balancer implementation assigns.
    loadBalancerIP: ""
    annotations: {}

storage:
  # Plex's own state: identity, metadata, codecs. Every pod mounts it.
  config:
    size: 50Gi
    accessMode: ReadWriteMany
    storageClass: ""
  # The media library, at the same path in every pod.
  media:
    size: 1Ti
    accessMode: ReadWriteMany
    storageClass: ""
    # Mount an existing claim instead of creating <release>-media, so Plex
    # scans what clustarr imports. It must be a claim in this release's
    # namespace bound to the same volume as clustarr's library: claims are
    # namespaced, so clustarr's own cannot be named here.
    existingClaim: ""
    subPath: ""

# Plex's background maintenance. Its own scheduler is disabled on every pod,
# because each process runs its own copy with no knowledge of the others, so
# these CronJobs drive it instead. A schedule change is a values change.
maintenance:
  enabled: true
  # Held to k8s/base/maintenance.yaml by test/manifests. No analysis is
  # scheduled: clustarr probes the media and seeds streams and markers
  # (ADR 0006), and GenerateBIFBehavior is never, so analyze and media-index
  # have nothing to do. backup-database copies Plex's SQLite file, and the
  # library lives in PostgreSQL.
  schedules:
    refresh: "0 3 * * *"
    clean-bundles: "0 4 * * 0"
    clean-cache: "30 4 * * 0"
    empty-trash: "30 1 * * *"

# The Plex library. This is an external database the chart does not create:
# every pod reads and writes it, which is what removes the need to replicate
# anything or elect a database primary.
#
# Two things to know before adopting it. Library search returns nothing, because
# the shim translates Plex's full-text MATCH into a constant false predicate.
# And title ordering follows PostgreSQL's default collation, because Plex's
# naturalsort collation has no equivalent here.
postgres:
  host: ""
  port: 5432
  database: plex
  user: plex
  # Must exist: the shim writes "SET search_path TO <schema>, public" on every
  # connection whatever this holds, so an empty one is a syntax error rather
  # than a fall back to the default search path.
  schema: plex
  # Plex opens 20 sessions to the library per process and every pod runs one,
  # so the database's max_connections has to cover poolMax times plex.replicas.
  poolSize: 50
  poolMax: 100
  # The password is read from a Secret rather than set here, so it stays out of
  # values and out of the rendered manifests.
  passwordSecret:
    name: ""
    key: password

# The remux pool: Plex Web's DASH streams (the video copied, the audio
# converted to stereo AAC) run here, in process with ffgo, instead of on
# Plex's transcoder; each pod keeps a cache of what it remuxed. Off, every
# browser stream stays on Plex's transcoder.
remux:
  enabled: true
  image:
    repository: ghcr.io/mediactl/cluster-plex-remux
    tag: ""
  replicas: 2
  autoscaling: {minReplicas: 1, maxReplicas: 6, targetCPU: 70}
  cache: {sizeLimit: 25Gi, maxBytes: 21474836480}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}
