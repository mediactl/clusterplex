image:
  repository: ghcr.io/mediactl/cluster-plex
  tag: dev
  pullPolicy: IfNotPresent

plex:
  # Every pod runs Plex against the shared library and serves clients; the
  # Lease decides only which one talks to plex.tv. See ADR-0004.
  replicas: 3
  # Pin the server identity so a rebuilt cluster keeps the identity clients
  # already know. Setting this on a server that already has one CHANGES it.
  machineIdentifier: ""
  # Settings an operator chooses, applied on every start. A list, not a map:
  # the config loader lowercases nested map keys and Plex names are case
  # sensitive.
  #
  # The settings this architecture depends on are NOT configurable here and the
  # manager will refuse to start if one is declared: the Butler schedulers (off,
  # replaced by the CronJobs below), remote-access publishing and automatic port
  # mapping (off, so no pod publishes itself to plex.tv or punches a hole to a
  # pod address), and customConnections (set from proxy.externalURL).
  preferences:
    - name: FriendlyName
      value: Cluster Plex
  # Plex wants little at rest and several cores for a transcode. The request
  # is what the scheduler places by; the memory limit keeps a runaway
  # transcode from taking the node with it. No CPU limit on purpose: a
  # throttled transcoder stutters.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  # One pod per node where the cluster has the nodes (ScheduleAnyway, so a
  # smaller cluster still schedules). Every pod serves, so this is what makes
  # a node going away cost one third rather than everything.
  spreadAcrossNodes: true
  # Plex's network namespace needs CAP_SYS_ADMIN to create and CAP_NET_ADMIN
  # to wire up. Privileged is the form that has been run. The unprivileged
  # form is the two capabilities, and then the render device for hardware
  # transcoding has to come from a device plugin (for example
  # gpu.intel.com/i915 in resources) rather than from privilege:
  #
  #   securityContext:
  #     privileged: false
  #     capabilities:
  #       add: [SYS_ADMIN, NET_ADMIN]
  securityContext:
    privileged: true
  # How long a stopping pod lets the client connections it holds finish
  # before Plex is stopped. A terminating pod has already left the Service,
  # so new clients go elsewhere; this is for the streams in flight, whose
  # transcode chunks live only on that pod.
  drainTimeout: 2m
  # Must cover drainTimeout plus the 30s Plex gets to flush on SIGTERM.
  terminationGracePeriodSeconds: 180
  # One pod at a time under eviction: every pod serves, and each one that
  # goes takes the sessions pinned to it.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

proxy:
  # The only thing clients connect to. Media bytes are served from here, so
  # THROUGHPUT SCALES WITH NODES, NOT REPLICAS: spreading these across nodes is
  # what raises the ceiling. See docs/media-proxy-pattern.md.
  replicas: 3
  # The address clients actually reach, for example
  # https://plex.example.com:32400. The manager forces this into Plex's
  # Preferences.xml as customConnections on every start. Without it Plex
  # advertises only the link-local address inside its own network namespace,
  # which no client can reach.
  externalURL: ""
  tls:
    # A Secret holding tls.crt and tls.key, served by the proxy. Plex clients
    # prefer a secure connection, and intercepting Plex's own plex.direct name
    # with a different certificate breaks native clients, so serve your own
    # hostname instead and name it in externalURL above.
    secretName: ""
  # How long a request waits for Plex during a failover before giving up.
  failoverGrace: 30s
  resources: {}
  service:
    # Empty asks for whatever the load balancer implementation assigns.
    loadBalancerIP: ""
    annotations: {}

storage:
  # Plex's own state: identity, metadata, codecs. Every pod mounts it.
  config:
    size: 50Gi
    accessMode: ReadWriteMany
    storageClass: ""
  # The media library, at the same path in every pod.
  media:
    size: 1Ti
    accessMode: ReadWriteMany
    storageClass: ""

# Plex's background maintenance. Its own scheduler is disabled on every pod,
# because each process runs its own copy with no knowledge of the others, so
# these CronJobs drive it instead. A schedule change is a values change.
maintenance:
  enabled: true
  schedules:
    analyze: "0 2 * * *"
    refresh: "0 3 * * *"
    clean-bundles: "0 4 * * 0"
    clean-cache: "30 4 * * 0"
    backup-database: "0 5 * * *"
    media-index: "0 1 * * *"
    empty-trash: "30 1 * * *"

# The Plex library. This is an external database the chart does not create:
# every pod reads and writes it, which is what removes the need to replicate
# anything or elect a database primary.
#
# Two things to know before adopting it. Library search returns nothing, because
# the shim translates Plex's full-text MATCH into a constant false predicate.
# And title ordering follows PostgreSQL's default collation, because Plex's
# naturalsort collation has no equivalent here.
postgres:
  host: ""
  port: 5432
  database: plex
  user: plex
  # Must exist: the shim writes "SET search_path TO <schema>, public" on every
  # connection whatever this holds, so an empty one is a syntax error rather
  # than a fall back to the default search path.
  schema: plex
  # Plex opens 20 sessions to the library per process and every pod runs one,
  # so the database's max_connections has to cover poolMax times plex.replicas.
  poolSize: 50
  poolMax: 100
  # The password is read from a Secret rather than set here, so it stays out of
  # values and out of the rendered manifests.
  passwordSecret:
    name: ""
    key: password
