{{- include "cluster-plex.validate" . }}
# What clients use, k8s/base's plex-main (held to it by test/manifests). It
# lands on the manager's TCP proxy, which holds 32400 in the pod namespace and
# forwards over a veth pair into the network namespace Plex runs in. See
# docs/adr/0003.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-plex.fullname" . }}
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  # Every pod that is ready, not the lease holder. Every pod runs Plex
  # (ADR-0004), and readiness already means this pod's Plex is answering.
  selector:
    app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: plex
  # Pin a client to one pod for the life of its session. A playback session
  # is not one request: the client starts a transcode, then fetches chunk
  # after chunk, and since ADR-0004 those chunks are written to a per-pod
  # emptyDir. Spread across pods, the pod asked for a chunk is usually not
  # the one that produced it, and the client gets "Error code: s1001
  # (Network)" a moment into playback.
  #
  # Done here rather than at a Gateway because plex.tv may rewrite what
  # customConnections holds into an https plex.direct URI whose certificate
  # lives on the Plex pod. Only an L4 path lets Plex terminate its own TLS, so
  # the affinity has to be L4 too (ADR-0005).
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeoutSeconds }}
  # ClientIP affinity hashes the source address, so it has to be the client's.
  externalTrafficPolicy: {{ include "cluster-plex.externalTrafficPolicy" (list .Values.service.externalTrafficPolicy "service.externalTrafficPolicy" "with Cluster, kube-proxy masquerades every external client as a node address and ClientIP affinity pins them all onto one pod. See docs/configuration.md, \"Sessions have to stay on one pod\"") }}
  ports:
    - name: pms
      port: 32400
      targetPort: proxy
---
# Stable DNS for the Plex pods, for transcode dispatch and the maintenance
# fan-out. Addresses are published before readiness, so a pod can be reached
# while it is still starting Plex.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-plex.fullname" . }}-workers
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: plex
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    # The manager's HTTP port, where the maintenance CronJobs ask for work.
    - name: probes
      port: 8080
      targetPort: probes
