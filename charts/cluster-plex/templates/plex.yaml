apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.plex.replicas }}
  serviceName: {{ .Release.Name }}-workers
  # No pod depends on another's ordinal: every pod runs Plex against the
  # shared library, and the Lease decides only who talks to plex.tv.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: plex
  template:
    metadata:
      labels:
        {{- include "cluster-plex.labels" . | nindent 8 }}
        app.kubernetes.io/component: plex
    spec:
      serviceAccountName: {{ .Release.Name }}-plex
      {{- if .Values.plex.unprivileged }}
      # Forwarding for Plex's network namespace, set by Kubernetes before any
      # container starts, since an unprivileged pod cannot write /proc/sys.
      # Every kubelet must allow-list net.ipv4.ip_forward or the pod is
      # rejected with SysctlForbidden; see plex.unprivileged.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
      {{- end }}
      {{- if .Values.plex.spreadAcrossNodes }}
      # One pod per node where the cluster has the nodes. Every pod serves,
      # so a node going away costs one third rather than everything;
      # ScheduleAnyway keeps a cluster with fewer nodes schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: plex
      {{- end }}
      # Covers the manager's drain (plex.drainTimeout), which lets the streams
      # this pod holds finish before Plex is told to stop, plus the 30s Plex
      # gets to flush on SIGTERM. Shorter, and the kubelet kills the pod
      # mid-drain.
      terminationGracePeriodSeconds: {{ .Values.plex.terminationGracePeriodSeconds }}
      containers:
        - name: plex
          image: {{ include "cluster-plex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Plex's network namespace needs CAP_SYS_ADMIN to create and
          # CAP_NET_ADMIN to wire up; see plex.unprivileged for the form
          # without privilege and what the cluster has to provide for it.
          {{- if .Values.plex.unprivileged }}
          securityContext:
            privileged: false
            capabilities:
              add: [SYS_ADMIN, NET_ADMIN]
          {{- else }}
          securityContext: {{- toYaml .Values.plex.securityContext | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTERPLEX_LEASE_NAME
              value: {{ .Release.Name }}-plextv
            - name: CLUSTERPLEX_WORKERS_SERVICE
              value: {{ .Release.Name }}-workers
            # How long a stopping pod lets the client connections it holds
            # finish before Plex is stopped. New clients go to the other pods
            # from the moment the pod starts terminating.
            - name: CLUSTERPLEX_DRAIN_TIMEOUT
              value: {{ .Values.plex.drainTimeout | quote }}
            {{- with .Values.proxy.externalURL }}
            # Plex advertises this to clients. The manager forces it into
            # Preferences.xml on every start; it is not an operator preference,
            # because it has to agree with what the proxy actually serves.
            - name: CLUSTERPLEX_PLEX_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            # Where the address comes from when externalURL is not set: the
            # manager reads this Service's LoadBalancer address before every
            # start. Naming it here rather than taking the default matters,
            # because the chart names its Service after the release.
            - name: CLUSTERPLEX_PLEX_EXTERNAL_SERVICE
              value: {{ .Release.Name | quote }}
            - name: CLUSTERPLEX_POSTGRES_HOST
              value: {{ required "postgres.host is required: the library lives in PostgreSQL" .Values.postgres.host | quote }}
            - name: CLUSTERPLEX_POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: CLUSTERPLEX_POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: CLUSTERPLEX_POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: CLUSTERPLEX_POSTGRES_SCHEMA
              value: {{ required "postgres.schema is required: the shim interpolates it into search_path on every connection" .Values.postgres.schema | quote }}
            - name: CLUSTERPLEX_POSTGRES_POOL_SIZE
              value: {{ .Values.postgres.poolSize | quote }}
            - name: CLUSTERPLEX_POSTGRES_POOL_MAX
              value: {{ .Values.postgres.poolMax | quote }}
            - name: CLUSTERPLEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.passwordSecret.name is required" .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
          ports:
            # The manager's proxy holds this port in the pod namespace and
            # forwards to Plex, which binds it inside its own namespace. There
            # is no second port: the proxy no longer needs one (ADR-0003).
            - name: pms
              containerPort: 32400
            - name: grpc
              containerPort: 50051
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /livez, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          startupProbe:
            httpGet: {path: /startupz, port: probes}
            failureThreshold: 30
            periodSeconds: 10
          {{- with .Values.plex.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: plex-config, mountPath: /var/lib/plexmediaserver}
            # Per-pod, carved back out of the shared claim above. Each of
            # these belongs to one Plex process, and sharing them is how
            # running Plex on every pod corrupts the library rather than
            # merely racing. See ADR-0004.
            #
            # The shadow SQLite the shim keeps, rebuilt on every start.
            - name: plex-databases
              mountPath: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Plug-in Support/Databases
            # One server's log, not three servers appending to one file.
            - name: plex-logs
              mountPath: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Logs
            # Transcode chunks are written and read back by the pod serving
            # that session, which the Service pins.
            - name: plex-transcode
              mountPath: /transcode
            - {name: plex-media, mountPath: /media}
            - {name: config, mountPath: /etc/clusterplex, readOnly: true}
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        # emptyDir rather than volumeClaimTemplates: each is rebuilt on start
        # or discarded between sessions, and a claim template is immutable
        # once created.
        - name: plex-databases
          emptyDir: {}
        - name: plex-logs
          emptyDir: {}
        - name: plex-transcode
          emptyDir: {}
