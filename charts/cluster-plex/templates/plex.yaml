apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.plex.replicas }}
  serviceName: {{ .Release.Name }}-workers
  # No pod depends on another's ordinal; the Lease decides who runs Plex.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: plex
  template:
    metadata:
      labels:
        {{- include "cluster-plex.labels" . | nindent 8 }}
        app.kubernetes.io/component: plex
    spec:
      serviceAccountName: {{ .Release.Name }}-plex
      # Long enough for Plex to flush its databases on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: plex
          image: {{ include "cluster-plex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # Plex's network namespace needs CAP_SYS_ADMIN to create and
            # CAP_NET_ADMIN to wire up. FUSE no longer figures in this: the
            # library is in PostgreSQL, so nothing mounts a filesystem.
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTERPLEX_LEASE_NAME
              value: {{ .Release.Name }}-plextv
            - name: CLUSTERPLEX_WORKERS_SERVICE
              value: {{ .Release.Name }}-workers
            - name: CLUSTERPLEX_PLEX_MODE
              value: {{ include "cluster-plex.plexMode" . }}
            {{- with .Values.proxy.externalURL }}
            # Plex advertises this to clients. The manager forces it into
            # Preferences.xml on every start; it is not an operator preference,
            # because it has to agree with what the proxy actually serves.
            - name: CLUSTERPLEX_PLEX_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            # Where the address comes from when externalURL is not set: the
            # manager reads this Service's LoadBalancer address before every
            # start. Naming it here rather than taking the default matters,
            # because the chart names its Service after the release.
            - name: CLUSTERPLEX_PLEX_EXTERNAL_SERVICE
              value: {{ .Release.Name | quote }}
            - name: CLUSTERPLEX_POSTGRES_HOST
              value: {{ required "postgres.host is required: the library lives in PostgreSQL" .Values.postgres.host | quote }}
            - name: CLUSTERPLEX_POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: CLUSTERPLEX_POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: CLUSTERPLEX_POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: CLUSTERPLEX_POSTGRES_SCHEMA
              value: {{ required "postgres.schema is required: the shim interpolates it into search_path on every connection" .Values.postgres.schema | quote }}
            - name: CLUSTERPLEX_POSTGRES_POOL_SIZE
              value: {{ .Values.postgres.poolSize | quote }}
            - name: CLUSTERPLEX_POSTGRES_POOL_MAX
              value: {{ .Values.postgres.poolMax | quote }}
            - name: CLUSTERPLEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.passwordSecret.name is required" .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
          ports:
            # The manager's proxy holds this port in the pod namespace and
            # forwards to Plex, which binds it inside its own namespace. There
            # is no second port: the proxy no longer needs one (ADR-0003).
            - name: pms
              containerPort: 32400
            - name: grpc
              containerPort: 50051
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /livez, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          startupProbe:
            httpGet: {path: /startupz, port: probes}
            failureThreshold: 30
            periodSeconds: 10
          {{- with .Values.plex.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: plex-config, mountPath: /var/lib/plexmediaserver}
            - {name: plex-media, mountPath: /media}
            - {name: config, mountPath: /etc/clusterplex, readOnly: true}
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
