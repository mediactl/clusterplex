{{- if .Values.videoTranscode.enabled }}
# The GPU pool: Plex's video conversions, decoded, scaled and encoded in
# process with ffgo on an Intel GPU
# (docs/superpowers/specs/2026-10-26-gpu-video-transcode-pool-design.md).
# Managers find these pods by app=plex-video-transcode and dial :50053; a pod
# is ready while its device has proved itself and a slot is free.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-plex.fullname" . }}-video-transcode
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.videoTranscode.replicas }}
  selector:
    matchLabels: {app: plex-video-transcode, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: plex-video-transcode, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        {{- with .Values.videoTranscode.renderGroups }}
        supplementalGroups: {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.videoTranscode.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.videoTranscode.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.videoTranscode.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: video
          image: {{ .Values.videoTranscode.image.repository }}:{{ .Values.videoTranscode.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --max-jobs={{ .Values.videoTranscode.maxJobs }}
            - --encoder={{ .Values.videoTranscode.encoder }}
            - --render-node={{ .Values.videoTranscode.renderNode }}
            - --inputs-dir=/run/video-inputs
          ports:
            - {name: grpc, containerPort: 50053}
            - {name: probe, containerPort: 8080}
          readinessProbe: {httpGet: {path: /readyz, port: probe}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: probe}}
          resources:
            {{- $res := deepCopy .Values.videoTranscode.resources }}
            {{- $gpu := .Values.videoTranscode.gpu }}
            {{- if and $gpu.resource (gt (int $gpu.count) 0) }}
            {{- $_ := set $res "limits" (merge (dict $gpu.resource (toString $gpu.count)) (default dict $res.limits)) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: inputs, mountPath: /run/video-inputs}
            - {name: media, mountPath: /media, readOnly: true{{ with .Values.storage.media.subPath }}, subPath: {{ . | quote }}{{ end }}}
      volumes:
        - name: inputs
          emptyDir: {medium: Memory, sizeLimit: {{ .Values.videoTranscode.inputs.sizeLimit }}}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "cluster-plex.mediaClaim" . }}
            readOnly: true
{{- end }}
