{{- if .Values.proxy.enabled }}
# The media proxy tier, opt in (proxy.enabled; docs/media-proxy-pattern.md).
# It serves direct-play bytes from the shared library and forwards everything
# else to a Plex pod, chosen by a consistent hash of the client. Clients reach
# it only if Plex advertises it: plex.externalURL must name its hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-plex.fullname" . }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "cluster-plex.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: {{ include "cluster-plex.fullname" . }}-proxy
      # Throughput comes from nodes, not replicas: each pod serves media over
      # its own node's interface, so stacking them on one node adds nothing.
      # Spreading is enforced rather than preferred for that reason.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: proxy
      containers:
        - name: proxy
          image: {{ include "cluster-plex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/proxy"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTERPLEX_FAILOVER_GRACE
              value: {{ .Values.proxy.failoverGrace | quote }}
            {{- if .Values.proxy.tls.secretName }}
            - name: CLUSTERPLEX_TLS_CERT
              value: /etc/clusterplex/tls/tls.crt
            - name: CLUSTERPLEX_TLS_KEY
              value: /etc/clusterplex/tls/tls.key
            {{- end }}
          ports:
            - name: pms
              containerPort: 32400
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /livez, port: probes}
          # Not ready until it knows where Plex is, so a proxy that cannot see
          # one leaves the load balancer instead of stalling connections.
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 5
          {{- with .Values.proxy.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Read only: the proxy serves media, it never changes the library.
            - {name: plex-media, mountPath: /media, readOnly: true{{ with .Values.storage.media.subPath }}, subPath: {{ . | quote }}{{ end }}}
            {{- if .Values.proxy.tls.secretName }}
            - {name: tls, mountPath: /etc/clusterplex/tls, readOnly: true}
            {{- end }}
      volumes:
        - name: plex-media
          persistentVolumeClaim:
            claimName: {{ include "cluster-plex.mediaClaim" . }}
            readOnly: true
        {{- if .Values.proxy.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.proxy.tls.secretName }}
        {{- end }}
---
# The media proxy's own LoadBalancer. Not the Service Plex advertises unless
# plex.externalURL names it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-plex.fullname" . }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
  {{- with .Values.proxy.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  # Traffic must enter through a node running a proxy pod: under Cluster,
  # media hairpins across the very links this tier exists to scale.
  externalTrafficPolicy: {{ include "cluster-plex.externalTrafficPolicy" (list .Values.proxy.service.externalTrafficPolicy "proxy.service.externalTrafficPolicy" "with Cluster, media traffic hairpins between nodes and client addresses are masqueraded. See docs/media-proxy-pattern.md") }}
  {{- with .Values.proxy.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "cluster-plex.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: proxy
  ports:
    - name: pms
      port: 32400
      targetPort: pms
{{- end }}
