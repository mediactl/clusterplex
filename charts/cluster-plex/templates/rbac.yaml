apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # Leader election, and the availability annotation the proxy follows.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update"]
  # Finding worker pods to dispatch transcodes to. Read only: leadership is
  # recorded on the Lease, never copied onto pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # The proxy only ever reads who is available.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-plex
roleRef:
  kind: Role
  name: {{ .Release.Name }}-plex
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-proxy
roleRef:
  kind: Role
  name: {{ .Release.Name }}-proxy
  apiGroup: rbac.authorization.k8s.io
