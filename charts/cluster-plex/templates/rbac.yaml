apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-plex.fullname" . }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster-plex.fullname" . }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # k8s/base's clusterplex-role, rule for rule; test/manifests holds the two
  # together.
  #
  # Electing the one pod that may talk to plex.tv.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "delete"]
  # Finding worker pods to dispatch transcodes and maintenance to, and marking
  # this pod as serving. The annotation says "this pod can do work", which the
  # Lease cannot express: it names one holder, and every pod serves.
  # Leadership itself is still never copied onto a pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "patch"]
  # Read-only, and only to learn the address clients reach Plex on, which the
  # manager advertises rather than having it written into values. An address
  # written down goes stale silently: it still validates and Plex still starts,
  # and it breaks only once a client signs in and follows the published
  # connection.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  {{- if and .Values.plex.liveTV.enabled (or (eq (.Values.plex.liveTV.cloudGuide | default "pms") "manager") (eq (.Values.plex.liveTV.xmltvGuide | default "pms") "manager")) (ne (.Values.plex.liveTV.cloudGuideBuild | default "job") "inProcess") }}
  # A built guide's build Job, cloud or XMLTV (plex.liveTV.cloudGuideBuild "job"): the
  # lease holder starts one per plan, waits on it, and deletes a finished one
  # before it starts the next under the same name; a new holder lists a
  # guide's Jobs to find a build its predecessor left running.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-plex.fullname" . }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-plex.fullname" . }}-plex
roleRef:
  kind: Role
  name: {{ include "cluster-plex.fullname" . }}-plex
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-plex.fullname" . }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster-plex.fullname" . }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # The proxy only ever reads who is available, and it reads it from the pods
  # rather than the Lease: it needs every pod that can serve, not the one that
  # owns plex.tv.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-plex.fullname" . }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-plex.fullname" . }}-proxy
roleRef:
  kind: Role
  name: {{ include "cluster-plex.fullname" . }}-proxy
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if or .Values.plex.clustarr.enabled .Values.plex.liveTV.enabled }}
---
# clustarr's catalog, read-only: the lease holder rescans the folders its
# MediaFiles change and refreshes the items whose metadata changes. It
# reconciles clustarr's PlexCollections into Plex and is the one writer of
# their status and finalizer (clustarr's 2026-11-10 plex-collections
# design, option A), recording Events on them. With
# plex.clustarr.tokenSecret it also keeps that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster-plex.fullname" . }}-clustarr-reader
  namespace: {{ include "cluster-plex.clustarrNamespace" . }}
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  - apiGroups: ["catalog.clustarr.io"]
    resources: ["mediafiles", "movies", "series", "episodes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.plex.clustarr.enabled }}
  # Plex collections: the finalizer by server-side apply (patch), and the
  # status.
  - apiGroups: ["catalog.clustarr.io"]
    resources: ["plexcollections"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["catalog.clustarr.io"]
    resources: ["plexcollections/status"]
    verbs: ["patch"]
  {{- end }}
  # The Events the lease holder records on PlexCollections and
  # IPTVProviders.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if .Values.plex.liveTV.enabled }}
  # Live TV: clustarr's IPTVProviders, read-only, and one Lease per block,
  # held as the server's machineIdentifier so one installation registers
  # each block.
  - apiGroups: ["clustarr.io"]
    resources: ["iptvproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
  {{- with .Values.plex.clustarr.tokenSecret }}
  # The server's plex.tv token, kept in this one Secret; create cannot be
  # limited by name, and the manager never lists or watches Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "cluster-plex.tpl" (list . $) | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-plex.fullname" . }}-clustarr-reader
  namespace: {{ include "cluster-plex.clustarrNamespace" . }}
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-plex.fullname" . }}-plex
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "cluster-plex.fullname" . }}-clustarr-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
