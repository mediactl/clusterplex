apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # Electing the one pod that may talk to plex.tv.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update"]
  # Finding worker pods to dispatch transcodes and maintenance to, and marking
  # this pod as serving. The annotation says "this pod can do work", which the
  # Lease cannot express: it names one holder, and in active mode every pod
  # serves. Leadership itself is still never copied onto a pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "patch"]
  # Read-only, and only to learn the address clients reach Plex on, which the
  # manager advertises rather than having it written into values. An address
  # written down goes stale silently: it still validates and Plex still starts,
  # and it breaks only once a client signs in and follows the published
  # connection.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
rules:
  # The proxy only ever reads who is available, and it reads it from the pods
  # rather than the Lease: it needs every pod that can serve, not the one that
  # owns plex.tv.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-plex
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-plex
roleRef:
  kind: Role
  name: {{ .Release.Name }}-plex
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-proxy
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-proxy
roleRef:
  kind: Role
  name: {{ .Release.Name }}-proxy
  apiGroup: rbac.authorization.k8s.io
