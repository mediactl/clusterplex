{{- range $name, $spec := dict "config" .Values.storage.config "media" .Values.storage.media }}
{{- if not (and (eq $name "media") $spec.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cluster-plex.fullname" $ }}-{{ $name }}
  labels: {{- include "cluster-plex.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ $spec.accessMode }}
  {{- with $spec.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $spec.size }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-plex.fullname" . }}-config
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
data:
  config.yaml: |
    plex:
      {{- with .Values.plex.machineIdentifier }}
      machine-identifier: {{ . | quote }}
      {{- end }}
      # Only the settings an operator chooses. The ones this architecture
      # depends on — the Butler schedulers, remote-access publishing, port
      # mapping and the advertised connection — are written by the manager on
      # every start and refused here, because each has one correct value and a
      # wrong one fails as something else entirely.
      preferences:
        {{- range .Values.plex.preferences }}
        - name: {{ .name | quote }}
          value: {{ .value | quote }}
        {{- end }}
      metadataProviders:
        {{- range .Values.plex.metadataProviders }}
        - uri: {{ include "cluster-plex.tpl" (list .uri $) | quote }}
        {{- end }}
      libraries:
        {{- range .Values.plex.libraries }}
        - name: {{ .name | quote }}
          type: {{ .type | quote }}
          provider: {{ .provider | quote }}
          language: {{ .language | default "en-US" | quote }}
          locations: {{ toJson .locations }}
          switchAgent: {{ .switchAgent | default false }}
          {{- with .preferences }}
          preferences:
            {{- range . }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
      clustarr:
        enabled: {{ .Values.plex.clustarr.enabled }}
        namespace: {{ include "cluster-plex.clustarrNamespace" . | quote }}
        {{- with .Values.plex.clustarr.tokenSecret }}
        tokenSecret: {{ include "cluster-plex.tpl" (list . $) | quote }}
        {{- end }}
        {{- with .Values.plex.clustarr.uiURL }}
        uiURL: {{ . | quote }}
        {{- end }}
        pathMappings:
          {{- range .Values.plex.clustarr.pathMappings }}
          - {clustarr: {{ .clustarr | quote }}, plex: {{ .plex | quote }}}
          {{- end }}
      liveTV:
        enabled: {{ .Values.plex.liveTV.enabled }}
        language: {{ .Values.plex.liveTV.language | default "eng" | quote }}
        restartEvery: {{ .Values.plex.liveTV.restartEvery | default "10m" | quote }}
        staleGrabAfter: {{ .Values.plex.liveTV.staleGrabAfter | default "5m" | quote }}
        guideRefreshWindow: {{ .Values.plex.liveTV.guideRefreshWindow | default "8-11" | quote }}
        guideLoadsInPostgres: {{ .Values.plex.liveTV.guideLoadsInPostgres | default false }}
        severalPods: {{ .Values.plex.liveTV.severalPods | default false }}
        cloudGuide: {{ .Values.plex.liveTV.cloudGuide | default "pms" | quote }}
        xmltvGuide: {{ .Values.plex.liveTV.xmltvGuide | default "pms" | quote }}
        cloudGuideBuild: {{ .Values.plex.liveTV.cloudGuideBuild | default "job" | quote }}
        cloudGuideJob: {{ .Values.plex.liveTV.cloudGuideJob | default dict | toJson | quote }}
    {{- if kindIs "slice" .Values.plex.codecPrefetch }}
    plex-codec-prefetch: {{ join "," .Values.plex.codecPrefetch | default "none" | quote }}
    {{- end }}
    {{- if not .Values.remux.enabled }}
    # No remux pool: every browser stream stays on Plex's transcoder.
    remux-selector: ""
    {{- end }}
    {{- if .Values.videoTranscode.enabled }}
    # The GPU pool takes every video conversion; the Lease counts them.
    video-selector: "app=plex-video-transcode"
    video-port: 50053
    video-lease-name: {{ .Values.videoTranscode.leaseName | quote }}
    {{- if .Values.videoTranscode.cpu.enabled }}
    # The CPU pool: asked first per video-cpu-when, else the GPU pool's
    # second chance; clustarr-busy reads clustarr's intel-work Lease.
    video-cpu-selector: "app=plex-video-transcode-cpu"
    video-cpu-when: {{ .Values.videoTranscode.cpu.when | quote }}
    {{- with include "cluster-plex.clustarrWorkLease" . }}
    clustarr-work-lease: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- else }}
    # No GPU pool: every video conversion is refused, never run on Plex's node.
    video-selector: ""
    {{- end }}
    {{- if .Values.plex.clustarr.enabled }}
    # A library scan of a provisioned section is a reconcile of clustarr's
    # projection (ADR 0008): the proxy sends it to this pod's manager.
    scan-route: "http://127.0.0.1:8080/api/v1/scan"
    {{- end }}
