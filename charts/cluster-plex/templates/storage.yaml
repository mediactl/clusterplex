{{- range $name, $spec := dict "config" .Values.storage.config "media" .Values.storage.media }}
{{- if not (and (eq $name "media") $spec.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cluster-plex.fullname" $ }}-{{ $name }}
  labels: {{- include "cluster-plex.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ $spec.accessMode }}
  {{- with $spec.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $spec.size }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-plex.fullname" . }}-config
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
data:
  config.yaml: |
    plex:
      {{- with .Values.plex.machineIdentifier }}
      machine-identifier: {{ . | quote }}
      {{- end }}
      # Only the settings an operator chooses. The ones this architecture
      # depends on — the Butler schedulers, remote-access publishing, port
      # mapping and the advertised connection — are written by the manager on
      # every start and refused here, because each has one correct value and a
      # wrong one fails as something else entirely.
      preferences:
        {{- range .Values.plex.preferences }}
        - name: {{ .name | quote }}
          value: {{ .value | quote }}
        {{- end }}
      metadataProviders:
        {{- range .Values.plex.metadataProviders }}
        - uri: {{ include "cluster-plex.tpl" (list .uri $) | quote }}
        {{- end }}
      libraries:
        {{- range .Values.plex.libraries }}
        - name: {{ .name | quote }}
          type: {{ .type | quote }}
          provider: {{ .provider | quote }}
          language: {{ .language | default "en-US" | quote }}
          locations: {{ toJson .locations }}
          switchAgent: {{ .switchAgent | default false }}
        {{- end }}
      clustarr:
        enabled: {{ .Values.plex.clustarr.enabled }}
        namespace: {{ include "cluster-plex.clustarrNamespace" . | quote }}
        {{- with .Values.plex.clustarr.tokenSecret }}
        tokenSecret: {{ include "cluster-plex.tpl" (list . $) | quote }}
        {{- end }}
        pathMappings:
          {{- range .Values.plex.clustarr.pathMappings }}
          - {clustarr: {{ .clustarr | quote }}, plex: {{ .plex | quote }}}
          {{- end }}
    {{- if not .Values.remux.enabled }}
    # No remux pool: every browser stream stays on Plex's transcoder.
    remux-selector: ""
    {{- end }}
