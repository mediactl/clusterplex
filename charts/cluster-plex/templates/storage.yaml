{{- range $name, $spec := dict "config" .Values.storage.config "media" .Values.storage.media }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "cluster-plex.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ $spec.accessMode }}
  {{- with $spec.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $spec.size }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "cluster-plex.labels" . | nindent 4 }}
data:
  config.yaml: |
    plex:
      {{- with .Values.plex.machineIdentifier }}
      machine-identifier: {{ . | quote }}
      {{- end }}
      # Only the settings an operator chooses. The ones this architecture
      # depends on — the Butler schedulers, remote-access publishing, port
      # mapping and the advertised connection — are written by the manager on
      # every start and refused here, because each has one correct value and a
      # wrong one fails as something else entirely.
      preferences:
        {{- range .Values.plex.preferences }}
        - name: {{ .name | quote }}
          value: {{ .value | quote }}
        {{- end }}
