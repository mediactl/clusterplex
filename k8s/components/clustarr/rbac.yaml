# clustarr's catalog, read-only; the one Secret plex.clustarr.tokenSecret
# names is the only thing the manager writes in clustarr's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plex-clustarr-reader
  namespace: clustarr-system
rules:
  - apiGroups: ["catalog.clustarr.io"]
    resources: ["mediafiles", "movies", "series", "episodes"]
    verbs: ["get", "list", "watch"]
  # The server's plex.tv token, kept by the lease holder in the Secret that
  # plex.clustarr.tokenSecret names (clustarr's Plex watchlist ImportList
  # reads it). Only that Secret is read or written; create cannot be limited
  # by name, and the manager never lists or watches Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["plex-token"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plex-clustarr-reader
  namespace: clustarr-system
subjects:
  - kind: ServiceAccount
    name: clusterplex-sa
    namespace: media
roleRef:
  kind: Role
  name: plex-clustarr-reader
  apiGroup: rbac.authorization.k8s.io
