apiVersion: v1
kind: Service
metadata:
  name: plex-main
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: plex
    plex-role: leader # Routes only to the pod executing the active PMS
  ports:
    - name: pms-tcp
      port: 32400
      targetPort: 32400
---
apiVersion: v1
kind: Service
metadata:
  name: plex-workers
  namespace: media
spec:
  clusterIP: None # Headless service mapping for inter-pod routing
  selector:
    app: plex
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
