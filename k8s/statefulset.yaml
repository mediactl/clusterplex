apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: media
spec:
  replicas: 3
  serviceName: plex-workers
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      serviceAccountName: clusterplex-sa
      containers:
        - name: plex
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
            privileged: true
          image: ghcr.io/mediactl/cluster-plex:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 32400
            - containerPort: 50051
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          # In a real deployment, mount RWX volumes for /media and /transcode here
          # volumeMounts:
          # - name: media-storage
          #   mountPath: /media
