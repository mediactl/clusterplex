apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
spec:
  replicas: 3
  serviceName: plex-workers
  # Pods do not depend on each other's ordinal: the library is PostgreSQL
  # and every pod shares it, so there is nothing to bring up in order.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      serviceAccountName: clusterplex-sa
      # Long enough for Plex to flush its databases on SIGTERM (manager grace is 30s).
      terminationGracePeriodSeconds: 60
      containers:
        - name: plex
          image: ghcr.io/mediactl/cluster-plex:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            # Plex's network namespace needs CAP_SYS_ADMIN to create and
            # CAP_NET_ADMIN to wire up. This was privileged for FUSE as
            # well, which went with LiteFS; the two capabilities may now be
            # enough on their own, which nobody has tried.
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            # The proxy holds Plex's own port in the pod namespace; Plex binds
            # it inside its namespace, where nothing else competes for it.
            - name: proxy
              containerPort: 32400
            - name: grpc
              containerPort: 50051
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          startupProbe:
            httpGet:
              path: /startupz
              port: probes
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: plex-config
              mountPath: /var/lib/plexmediaserver
            - name: plex-media
              mountPath: /media
            - name: config
              mountPath: /etc/clusterplex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: clusterplex-config
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media
