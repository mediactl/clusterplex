apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
spec:
  replicas: 3
  serviceName: plex-workers
  # Pods do not depend on each other's ordinal; LiteFS elects the primary.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      serviceAccountName: clusterplex-sa
      # Long enough for Plex to flush its databases on SIGTERM (manager grace is 30s).
      terminationGracePeriodSeconds: 60
      containers:
        - name: plex
          image: ghcr.io/mediactl/cluster-plex:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            # FUSE needs /dev/fuse plus CAP_SYS_ADMIN and the port redirect
            # needs CAP_NET_ADMIN; privileged is the only mode that provides
            # the device without a device plugin.
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: proxy
              containerPort: 32499
            - name: grpc
              containerPort: 50051
            - name: litefs
              containerPort: 20202
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          startupProbe:
            httpGet:
              path: /startupz
              port: probes
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: litefs-data
              mountPath: /var/lib/litefs
            - name: plex-config
              mountPath: /var/lib/plexmediaserver
            - name: plex-media
              mountPath: /media
      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media
  volumeClaimTemplates:
    # LiteFS transaction files and the database copies: per pod, never shared.
    - metadata:
        name: litefs-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
