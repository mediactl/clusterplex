apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
spec:
  replicas: 3
  serviceName: plex-workers
  # Pods do not depend on each other's ordinal: the library is PostgreSQL
  # and every pod shares it, so there is nothing to bring up in order.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      serviceAccountName: clusterplex-sa
      # One pod per node where the cluster has the nodes. Every pod serves,
      # so spreading them makes a node going away cost one third rather than
      # everything; ScheduleAnyway keeps a one-node cluster schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: plex
      # The manager's drain (2m by default, CLUSTERPLEX_DRAIN_TIMEOUT) lets
      # the streams this pod holds finish before Plex is told to stop, then
      # Plex gets 30s to flush on SIGTERM. This has to cover both, or the
      # kubelet kills the pod mid-drain and the drain was for nothing.
      terminationGracePeriodSeconds: 180
      containers:
        - name: plex
          image: ghcr.io/mediactl/cluster-plex:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            # Plex's network namespace needs CAP_SYS_ADMIN to create and
            # CAP_NET_ADMIN to wire up. This was privileged for FUSE as
            # well, which went with LiteFS; the two capabilities may now be
            # enough on their own, which nobody has tried.
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The shared library. These manifests do not deploy PostgreSQL,
            # they expect one to be reachable at this Service, and they do not
            # create the Secret below either.
            #
            # Only the host and the password have no usable default. The rest
            # repeat the manager's own, written out so a reader can see what
            # the pods will connect with without going to `--help`, and so
            # changing one is an edit here rather than a new flag.
            - name: CLUSTERPLEX_POSTGRES_HOST
              value: plex-postgres
            - name: CLUSTERPLEX_POSTGRES_PORT
              value: "5432"
            - name: CLUSTERPLEX_POSTGRES_DATABASE
              value: plex
            - name: CLUSTERPLEX_POSTGRES_USER
              value: plex
            # Not optional. The shim interpolates it into
            # "SET search_path TO <schema>, public" whatever it holds, so an
            # empty one is a syntax error on every connection rather than a
            # fall back to the default search path.
            - name: CLUSTERPLEX_POSTGRES_SCHEMA
              value: plex
            # Plex opens 20 sessions per process and every pod runs one, so
            # the database's max_connections has to cover POOL_MAX times the
            # replica count.
            - name: CLUSTERPLEX_POSTGRES_POOL_SIZE
              value: "50"
            - name: CLUSTERPLEX_POSTGRES_POOL_MAX
              value: "100"
            - name: CLUSTERPLEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plex-postgres
                  key: password
          # Plex wants little at rest and several cores for a transcode. The
          # request is what the scheduler places by; the memory limit is what
          # keeps a runaway transcode from taking the node with it. No CPU
          # limit on purpose: a throttled transcoder stutters, and the pod
          # sharing the node fairly is what the request already buys.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          ports:
            # The proxy holds Plex's own port in the pod namespace; Plex binds
            # it inside its namespace, where nothing else competes for it.
            - name: proxy
              containerPort: 32400
            - name: grpc
              containerPort: 50051
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          startupProbe:
            httpGet:
              path: /startupz
              port: probes
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: plex-config
              mountPath: /var/lib/plexmediaserver
            # Per-pod, carved back out of the shared claim above. Each of
            # these belongs to one Plex process, and sharing them is how
            # running Plex on every pod corrupts the library rather than
            # merely racing. See ADR-0004.
            #
            # The shadow SQLite the shim keeps. It is rebuilt on every start,
            # deliberately, because the shim writes DDL to it as it runs and a
            # kept one drifts from what PostgreSQL holds — so three pods would
            # rebuild one file while the other two held it open.
            - name: plex-databases
              mountPath: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Plug-in Support/Databases
            # One server's log, not three servers appending to one file.
            - name: plex-logs
              mountPath: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Logs
            # Transcode chunks are written and read back by the pod serving
            # that session, which the proxy pins. On shared storage they would
            # be a network round trip per chunk for no benefit.
            - name: plex-transcode
              mountPath: /transcode
            - name: plex-media
              mountPath: /media
            - name: config
              mountPath: /etc/clusterplex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: clusterplex-config
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media
        # emptyDir rather than volumeClaimTemplates: every one of these is
        # rebuilt on start or discarded between sessions, so none needs to
        # outlive the pod — and a claim template is immutable once created,
        # which this repo has already paid for once.
        - name: plex-databases
          emptyDir: {}
        - name: plex-logs
          emptyDir: {}
        - name: plex-transcode
          emptyDir: {}
