# What every pod must see one copy of: Preferences.xml (the server identity and
# the plex.tv token), the Metadata and Media bundles, Codecs and Cache. A
# poster one pod fetches has to be on disk for the pod that serves the next
# request for it.
#
# Every pod writes to it, which is new — this used to say "only the leader
# writes to it", and that stopped being true when every pod started running
# Plex (ADR-0004). What does NOT belong here is carved back out in the
# StatefulSet as emptyDir mounts: the shim's shadow databases, the logs and the
# transcode directory. Sharing one of those corrupts the library rather than
# failing loudly.
#
# Point volumeName at an existing NFS or CephFS volume where that is the site
# convention.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
# The media library, mounted at the same path in every pod so a worker can
# open the file the leader named in the transcode arguments.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
