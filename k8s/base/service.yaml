# plex-main is what clients use. It selects only the pod currently running
# Plex Media Server and lands on the manager's TCP proxy, which forwards over
# a veth pair into the network namespace Plex runs in. See docs/adr/0003.
apiVersion: v1
kind: Service
metadata:
  name: plex-main
spec:
  type: LoadBalancer
  # Every pod that is ready, not the lease holder. Every pod runs Plex
  # (ADR-0004), and readiness already means this pod's Plex is answering — a
  # pod serving Plex is not ready until it does. Selecting on plex-role sent
  # every client to one pod, which is the thing active-active exists to stop,
  # and it selected nothing at all once the label stopped following the lease.
  selector:
    app: plex
  # Pin a client to one pod for the life of its session.
  #
  # A playback session is not one request. The client asks to start a
  # transcode, then fetches chunk after chunk, and since ADR-0004 those chunks
  # are written to a per-pod emptyDir. Spread across three pods, the pod asked
  # for a chunk is usually not the pod that produced it, and the client gets
  # "Error code: s1001 (Network)" a moment into playback. Measured before this
  # was set: one client identifier, twelve requests, 8/4/0 across the pods.
  #
  # This is done here rather than at a Gateway because plex.tv rewrites
  # whatever customConnections holds into an https <address>.<uuid>.plex.direct
  # URI, and the certificate for that name lives on the Plex pod. Only an L4
  # path lets Plex terminate its own TLS, so the affinity has to be L4 too.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      # Longer than a request, because what has to survive is the session: a
      # client that moves pods mid-film loses its chunks. Three hours covers a
      # feature-length transcode.
      timeoutSeconds: 10800
  # ClientIP affinity hashes the source address, so the source address has to
  # be the client's. Under the default Cluster policy kube-proxy SNATs external
  # traffic to a node address and every external client would look like one
  # client, pinning all of them onto a single pod.
  externalTrafficPolicy: Local
  ports:
    - name: pms
      port: 32400
      targetPort: proxy
---
# plex-workers gives every pod a stable DNS name for job dispatch. Addresses
# are published before readiness so a pod can be reached while it is still
# starting Plex.
apiVersion: v1
kind: Service
metadata:
  name: plex-workers
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: plex
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
