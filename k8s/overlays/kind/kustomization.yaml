# kind has no ReadWriteMany storage class. Its single node lets several pods
# share a ReadWriteOnce volume, so the overlay downgrades the shared claims.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Stand-ins for clustarr: a provider root, its ui Service name and the
  # catalog CRDs the manager watches.
  - clustarr-fixture.yaml
components:
  - ../../components/clustarr
patches:
  # kind is a throwaway test cluster, so it pins a fixed server identity: the
  # cluster stays reproducible and rebuilding it does not present a new server
  # to clients. Set here as an environment variable rather than in the
  # ConfigMap so the base file stays the documented example.
  - target:
      kind: StatefulSet
      name: plex
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLUSTERPLEX_PLEX_MACHINE_IDENTIFIER
          value: 11111111-2222-3333-4444-555555555555
      # Nothing sets CLUSTERPLEX_PLEX_EXTERNAL_URL here on purpose.
      #
      # Plex would otherwise advertise 169.254.1.2, the only address it can see
      # from inside its own network namespace, which no client can reach. The
      # manager fills that gap by reading plex-main's LoadBalancer address
      # before every start — see plex-external-service.
      #
      # It was written down here once, and went stale when the LoadBalancer
      # moved. That failure is invisible: the address still validates and Plex
      # still starts, and it breaks only when a client signs in, because
      # plex.tv hands back the published connection and the client switches to
      # it. Set this only for an address the cluster cannot see, such as a DNS
      # name with a certificate in front.

  - target:
      kind: PersistentVolumeClaim
      name: plex-config
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: plex-media
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  # Provision a library on the fixture provider and follow the fixture
  # catalog. Replaces config.yaml whole, so it repeats the base's FriendlyName.
  - target:
      kind: ConfigMap
      name: clusterplex-config
    patch: |-
      - op: replace
        path: /data/config.yaml
        value: |
          plex:
            preferences:
              - name: FriendlyName
                value: Cluster Plex
            metadataProviders:
              - uri: http://clustarr-ui.clustarr-system.svc:8080/plex/movies
            libraries:
              - name: Clustarr Fixture Movies
                type: movie
                provider: tv.plex.agents.custom.clustarr.movies
                language: en-US
                locations: [/media/fixture-movies]
            clustarr:
              enabled: true
              namespace: clustarr-system
              pathMappings:
                - {clustarr: /data/media, plex: /media}
