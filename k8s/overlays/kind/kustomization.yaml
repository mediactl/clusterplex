# kind has no ReadWriteMany storage class. Its single node lets several pods
# share a ReadWriteOnce volume, so the overlay downgrades the shared claims.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # kind is a throwaway test cluster, so it pins a fixed server identity: the
  # cluster stays reproducible and rebuilding it does not present a new server
  # to clients. Set here as an environment variable rather than in the
  # ConfigMap so the base file stays the documented example.
  - target:
      kind: StatefulSet
      name: plex
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLUSTERPLEX_PLEX_MACHINE_IDENTIFIER
          value: 11111111-2222-3333-4444-555555555555
      # Without this Plex advertises 169.254.1.2, the only address it can see
      # from inside its own network namespace, and no client can reach it.
      #
      # This address has to be live, not merely well-formed. Plex publishes it
      # to plex.tv, and a client that signs in stops using whatever address it
      # was typed and switches to the published one — so a stale value here
      # works right up until someone logs in, then fails on the way back. Point
      # it at plex-main's LoadBalancer address:
      #
      #   kubectl get svc plex-main -n media -o \
      #     jsonpath='{.status.loadBalancer.ingress[0].ip}'
      #
      # Not the Envoy Gateway. plex.tv rewrites whatever is here into an https
      # <address>.<cert-uuid>.plex.direct URI, and the certificate for it lives
      # on the Plex pod; the Gateway's listener is plain HTTP and the handshake
      # fails. plex-main is L4, so Plex terminates its own TLS through it.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLUSTERPLEX_PLEX_EXTERNAL_URL
          value: http://172.19.0.6:32400

  - target:
      kind: PersistentVolumeClaim
      name: plex-config
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: plex-media
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
