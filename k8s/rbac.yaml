apiVersion: v1
kind: ServiceAccount
metadata:
  name: plex-supervisor-sa
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plex-supervisor-role
  namespace: media
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plex-supervisor-binding
  namespace: media
subjects:
  - kind: ServiceAccount
    name: plex-supervisor-sa
roleRef:
  kind: Role
  name: plex-supervisor-role
  apiGroup: rbac.authorization.k8s.io
