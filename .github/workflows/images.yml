# Builds and publishes the cluster-plex images for linux/amd64 and
# linux/arm64 -- each platform natively on its own runner (GitHub's arm64
# runners are free for public repositories), never under QEMU, because the
# PostgreSQL shim is a Rust build that takes 25 minutes emulated and 3
# native. Each platform's image is pushed by digest, then one manifest list
# per image is assembled from the digests and tagged.
#
# Tags: the 7-character commit sha (what the charts' image.tag carries),
# the branch name, `latest` on main, and the semver of a `v*` tag. A pull
# request builds both platforms and pushes nothing. The build cache lives in
# the registry beside the image (`:buildcache-<arch>`), so a change that
# leaves the shim stage untouched reuses its layers.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "charts/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "charts/**"
  workflow_dispatch:
    inputs:
      plex_pg_ref:
        description: "plex-postgresql tag to build the shim from (default: the Dockerfile's PLEX_PG_REF)"
        required: false
        type: string
      push:
        description: "Push the images"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: mediactl
  # A pull request builds without pushing; a dispatch may ask not to.
  PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [cluster-plex, cluster-plex-remux]
        arch: [amd64, arm64]
        include:
          - image: cluster-plex
            dockerfile: Dockerfile
            target: release
          - image: cluster-plex-remux
            dockerfile: images/Dockerfile.remux
            target: remux
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.vendor=machinectl

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.plex_pg_ref && format('PLEX_PG_REF={0}', inputs.plex_pg_ref) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/{1}/{2}:buildcache-{3},mode=max', env.REGISTRY, env.OWNER, matrix.image, matrix.arch) || '' }}
          # Pushed by digest, untagged; the merge job names it. A build that
          # pushes nothing has no output and is discarded after the cache.
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0}/{1}/{2},name-canonical=true,push-by-digest=true,push=true', env.REGISTRY, env.OWNER, matrix.image) || '' }}

      - name: Export the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        image: [cluster-plex, cluster-plex-remux]
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          test "$(ls | wc -l)" -eq 2 || { echo "expected two digests, found: $(ls)"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          {
            echo "### ${{ matrix.image }}"
            echo
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
